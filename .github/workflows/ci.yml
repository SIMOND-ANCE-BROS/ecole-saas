name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: proprio
          POSTGRES_PASSWORD: proprio
          POSTGRES_DB: ecole
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/ecole
      DATABASE_ADMIN_URL: postgres://proprio:proprio@localhost:5432/ecole
      # Valeur réservée aux tests de la CI, sans rapport avec un vrai secret.
      BETTER_AUTH_SECRET: secret-de-test-ci-uniquement-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rôles PostgreSQL
        run: PGPASSWORD=proprio psql -h localhost -U proprio -d ecole -f docker/init.sql
      - name: Migrations
        run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tests d’intégration (base réelle)
        run: npm run test:integration
