name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; jobs ask for more only if they need it.
permissions:
  contents: read

# A new push on the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: proprio
          POSTGRES_PASSWORD: proprio
          POSTGRES_DB: ecole
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/ecole
      DATABASE_ADMIN_URL: postgres://proprio:proprio@localhost:5432/ecole
      # Value reserved for CI tests, unrelated to any real secret.
      BETTER_AUTH_SECRET: secret-de-test-ci-uniquement-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL roles
        run: PGPASSWORD=proprio psql -h localhost -U proprio -d ecole -f docker/init.sql
      - name: Migrations
        run: npm run db:migrate
      - run: npm run format:check
      # typecheck first: it generates the Next route types that type-aware lint rules need.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests (real database)
        run: npm run test:integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Production dependencies only: dev-tool alerts are tracked in #108.
      - name: npm audit (high and critical, runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same pinned, checksum-verified binary and rules as the pre-commit hook.
      - name: gitleaks on the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          sh scripts/gitleaks.sh git --redact --no-banner --log-level warn --log-opts="$range"

  # Single check to require on main: fails if any job above failed or was skipped.
  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [verify, audit, secret-scan]
    if: always()
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
