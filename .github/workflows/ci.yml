name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; jobs ask for more only if they need it.
permissions:
  contents: read

# A new push on the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: proprio
          POSTGRES_PASSWORD: proprio
          POSTGRES_DB: ecole
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/ecole
      DATABASE_ADMIN_URL: postgres://proprio:proprio@localhost:5432/ecole
      # Value reserved for CI tests, unrelated to any real secret.
      BETTER_AUTH_SECRET: secret-de-test-ci-uniquement-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL roles
        run: PGPASSWORD=proprio psql -h localhost -U proprio -d ecole -f docker/init.sql
      - name: Migrations
        run: npm run db:migrate
      - run: npm run format:check
      # typecheck first: it generates the Next route types that type-aware lint rules need.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests (real database)
        run: npm run test:integration
      # Catches what tsc and the dev server miss: prerendering, route and config errors (#159).
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Production dependencies only: dev-tool alerts are tracked in #108.
      - name: npm audit (high and critical, runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same pinned, checksum-verified binary and rules as the pre-commit hook.
      - name: gitleaks on the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          sh scripts/gitleaks.sh git --redact --no-banner --log-level warn --log-opts="$range"

  # Production image (#337): builds the Dockerfile, never pushes it, then runs it the way
  # production does against a throw-away database. Plain `docker build` (the runner's Docker): no
  # extra action, no registry credentials, read-only token.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: proprio
          POSTGRES_PASSWORD: proprio
          POSTGRES_DB: ecole
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Values reserved for CI, unrelated to any real secret.
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/ecole
      DATABASE_ADMIN_URL: postgres://proprio:proprio@localhost:5432/ecole
      BETTER_AUTH_URL: http://localhost:3000
      HARDEN: --cap-drop=ALL --security-opt no-new-privileges --read-only --tmpfs /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Throw-away secrets for this run only: none is written in the repository.
      - name: Random secrets for the web server
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JOBS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build the production image
        run: docker build --pull -t ecole-saas:ci .
      - name: Image runs as non-root
        run: test "$(docker image inspect ecole-saas:ci --format '{{.Config.User}}')" = node
      - name: PostgreSQL roles
        run: PGPASSWORD=proprio psql -h localhost -U proprio -d ecole -f docker/init.sql
      # The bundled scripts run as in production: a module esbuild could not resolve fails here.
      - name: Migrations and scheduled scripts from the image
        run: |
          for script in migrate purge-submissions mark-overdue-installments pseudonymise-audit-log sync-calendars; do
            docker run --rm --init $HARDEN --network host \
              -e DATABASE_URL -e DATABASE_ADMIN_URL ecole-saas:ci node "scripts/$script.mjs"
          done
      - name: Web server answers
        run: |
          docker run -d --init $HARDEN --tmpfs /app/.next/cache:uid=1000,gid=1000 --network host \
            -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e JOBS_SECRET \
            --name web ecole-saas:ci
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:3000/connexion && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3000/connexion
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/taches/factures)" = 401
          curl -sf -o /dev/null -X POST -H "Authorization: Bearer $JOBS_SECRET" http://127.0.0.1:3000/api/taches/factures
      - name: Web server log
        if: failure()
        run: docker logs web || true

  # Single check to require on main: fails if any job above failed or was skipped.
  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [verify, audit, secret-scan, image]
    if: always()
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
