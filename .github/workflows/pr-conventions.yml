name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    uses: GabinSMD/shared-workflows/.github/workflows/pr-conventions.yml@main
