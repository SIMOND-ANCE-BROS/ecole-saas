name: Project status

# Keeps the « École de danse — Roadmap » Project in step with the work
# (docs/guides/issues.md §8):
#
#   issue opened / reopened           → Todo
#   draft PR referencing #N           → In Progress
#   PR ready for review               → In Review
#   PR merged, `Closes/Fixes #N`      → Done (GitHub closes the issue)
#   PR merged, `Refs #N`              → In Progress (the issue awaits other PRs)
#   PR closed without merge           → Todo
#   issue closed                      → Done
#
# Writing to an organisation Project needs a dedicated token (secret
# PROJECT_TOKEN): GITHUB_TOKEN cannot. Without the secret, nothing happens.

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: SIMOND-ANCE-BROS
  PROJECT_NUMBER: 2

jobs:
  synchroniser:
    name: Sync the Project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'issues' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Move the cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret missing: Project not updated."
            exit 0
          fi
          move() { bash .github/scripts/project-status.sh "$@"; }

          if [ "$EVENT" = "issues" ]; then
            case "$ACTION" in
              opened|reopened) move "Todo" "$ISSUE" ;;
              closed)          move "Done" "$ISSUE" ;;
            esac
            exit 0
          fi

          # Issues cited in the PR description (read from the environment, never interpolated).
          closing=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<<"$PR_BODY" \
            | grep -oE '[0-9]+' | sort -u || true)
          refs=$(grep -oiE '\brefs? +#[0-9]+' <<<"$PR_BODY" | grep -oE '[0-9]+' | sort -u || true)
          all=$(printf '%s\n%s\n' "$closing" "$refs" | grep -E '^[0-9]+$' | sort -u || true)

          if [ -z "$all" ]; then
            echo "::warning::The PR references no issue (Closes #N / Refs #N): see docs/guides/issues.md."
            exit 0
          fi

          # shellcheck disable=SC2086
          case "$ACTION" in
            closed)
              if [ "$PR_MERGED" = "true" ]; then
                if [ -n "$closing" ]; then move "Done" $closing; fi
                if [ -n "$refs" ]; then move "In Progress" $refs; fi
              else
                move "Todo" $all
              fi
              ;;
            *)
              if [ "$PR_DRAFT" = "true" ]; then move "In Progress" $all; else move "In Review" $all; fi
              ;;
          esac
