services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: proprio
      POSTGRES_PASSWORD: proprio
      POSTGRES_DB: ecole
    ports:
      # 5433 côté hôte : le 5432 est souvent pris par un autre projet local.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
