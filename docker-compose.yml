services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: proprio
      POSTGRES_PASSWORD: proprio
      POSTGRES_DB: ecole
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
